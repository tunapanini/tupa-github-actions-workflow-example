name: Deploy ECS Service (Reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: "배포 환경 (development/production)"
        required: true
        type: string
      image_tag:
        description: "배포할 Docker 이미지 태그"
        required: true
        type: string
      service_name:
        description: "서비스 이름"
        required: true
        type: string
      task_definition_suffix:
        description: "Task Definition 접미사"
        required: true
        type: string
      cluster_suffix:
        description: "ECS Cluster 접미사"
        required: true
        type: string

jobs:
  deploy:
    name: Deploy ${{ inputs.service_name }}
    runs-on: ubuntu-latest

    env:
      # 환경별 공통 설정
      AWS_REGION: ap-northeast-2
      ECR_REPOSITORY: my-app

    steps:
      - name: Set environment-specific variables
        id: env-config
        run: |
          ENV="${{ inputs.environment }}"

          # 환경별 공통 변수 설정
          if [[ "$ENV" == "production" ]]; then
            echo "account_id=111111111111" >> $GITHUB_OUTPUT
            echo "vpc_subnet=subnet-prod-xxxxx" >> $GITHUB_OUTPUT
            echo "security_group=sg-prod-xxxxx" >> $GITHUB_OUTPUT
            echo "log_level=warn" >> $GITHUB_OUTPUT
            echo "desired_count=3" >> $GITHUB_OUTPUT
          else
            echo "account_id=222222222222" >> $GITHUB_OUTPUT
            echo "vpc_subnet=subnet-dev-xxxxx" >> $GITHUB_OUTPUT
            echo "security_group=sg-dev-xxxxx" >> $GITHUB_OUTPUT
            echo "log_level=debug" >> $GITHUB_OUTPUT
            echo "desired_count=1" >> $GITHUB_OUTPUT
          fi

          # 서비스별 변수 조합
          echo "cluster_name=$ENV-cluster-${{ inputs.cluster_suffix }}" >> $GITHUB_OUTPUT
          echo "task_definition=$ENV-task-${{ inputs.task_definition_suffix }}" >> $GITHUB_OUTPUT
          echo "service_name=$ENV-svc-${{ inputs.service_name }}" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        run: "echo ❤️"
