name: Manual Deploy to ECS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "배포 환경"
        required: true
        type: choice
        options:
          - development
          - production

      image_tag:
        description: "배포할 이미지 태그 (예: abc123def 또는 latest)"
        required: true
        type: string

      services:
        description: "배포할 서비스 선택"
        required: true
        type: choice
        options:
          - all
          - api-gateway
          - user-service
          - order-service
          - payment-service
          - notification-service

jobs:
  # ============================================
  # 배포 대상 서비스 결정
  # ============================================
  prepare:
    name: Prepare Deployment
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      environment: ${{ inputs.environment }}
      image_tag: ${{ inputs.image_tag }}

    steps:
      - name: Set deployment matrix
        id: set-matrix
        run: |
          if [[ "${{ inputs.services }}" == "all" ]]; then
            # 모든 서비스 배포
            MATRIX=$(cat << 'EOF'
          {
            "service": [
              {"name": "api-gateway", "task_definition_suffix": "api-gateway", "cluster_suffix": "main"},
              {"name": "user-service", "task_definition_suffix": "user-svc", "cluster_suffix": "main"},
              {"name": "order-service", "task_definition_suffix": "order-svc", "cluster_suffix": "main"},
              {"name": "payment-service", "task_definition_suffix": "payment-svc", "cluster_suffix": "payment"},
              {"name": "notification-service", "task_definition_suffix": "notification-svc", "cluster_suffix": "async"}
            ]
          }
          EOF
          )
          else
            # 단일 서비스 배포
            case "${{ inputs.services }}" in
              "api-gateway")
                MATRIX='{"service": [{"name": "api-gateway", "task_definition_suffix": "api-gateway", "cluster_suffix": "main"}]}'
                ;;
              "user-service")
                MATRIX='{"service": [{"name": "user-service", "task_definition_suffix": "user-svc", "cluster_suffix": "main"}]}'
                ;;
              "order-service")
                MATRIX='{"service": [{"name": "order-service", "task_definition_suffix": "order-svc", "cluster_suffix": "main"}]}'
                ;;
              "payment-service")
                MATRIX='{"service": [{"name": "payment-service", "task_definition_suffix": "payment-svc", "cluster_suffix": "payment"}]}'
                ;;
              "notification-service")
                MATRIX='{"service": [{"name": "notification-service", "task_definition_suffix": "notification-svc", "cluster_suffix": "async"}]}'
                ;;
            esac
          fi

          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "📋 Deployment Matrix:"
          echo "$MATRIX" | jq .

      - name: Validate image tag
        run: "echo ❤️"
        # run: |
        #   echo "🔍 Validating image tag: ${{ inputs.image_tag }}"
        #   echo "Environment: ${{ inputs.environment }}"
        #   echo "Services: ${{ inputs.services }}"

        #   # ECR에서 이미지 태그 존재 여부 확인 (예제)
        #   # aws ecr describe-images --repository-name my-app --image-ids imageTag=${{ inputs.image_tag }}

  # ============================================
  # ECS 병렬 배포
  # ============================================
  deploy:
    name: Deploy ${{ matrix.service.name }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    env:
      AWS_REGION: ap-northeast-2
      ECR_REPOSITORY: my-app

    steps:
      - name: Set environment-specific variables
        id: env-config
        run: |
          ENV="${{ inputs.environment }}"

          if [[ "$ENV" == "production" ]]; then
            echo "account_id=111111111111" >> $GITHUB_OUTPUT
            echo "desired_count=3" >> $GITHUB_OUTPUT
          else
            echo "account_id=222222222222" >> $GITHUB_OUTPUT
            echo "desired_count=1" >> $GITHUB_OUTPUT
          fi

          echo "cluster_name=$ENV-cluster-${{ matrix.service.cluster_suffix }}" >> $GITHUB_OUTPUT
          echo "task_definition=$ENV-task-${{ matrix.service.task_definition_suffix }}" >> $GITHUB_OUTPUT
          echo "service_name=$ENV-svc-${{ matrix.service.name }}" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        run: "echo ❤️"
        # uses: aws-actions/configure-aws-credentials@v4
        # with:
        #   aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        #   aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        #   aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to ECS
