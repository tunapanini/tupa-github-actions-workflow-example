        #   echo "⏳ Waiting for service stability..."
        #   echo "aws ecs wait services-stable --cluster ${{ steps.env-config.outputs.cluster_name }} --services ${{ steps.env-config.outputs.service_name }}"
        #   echo "✅ ${{ matrix.service.name }} deployed successfully!"

  # ============================================
  # 배포 결과 알림
  # ============================================
  notify:
    name: Notify Result
    needs: [prepare, deploy]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Collect deployment results
        id: results
        run: |
          DEPLOY_RESULT="${{ needs.deploy.result }}"

          if [[ "$DEPLOY_RESULT" == "success" ]]; then
            echo "status=✅ 성공" >> $GITHUB_OUTPUT
            echo "color=#36a64f" >> $GITHUB_OUTPUT
          else
            echo "status=❌ 실패" >> $GITHUB_OUTPUT
