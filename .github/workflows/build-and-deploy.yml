name: Build and Deploy to ECS

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: "배포 환경 선택"
        required: true
        default: "development"
        type: choice
        options:
          - development
          - production

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: my-app

jobs:
  # ============================================
  # Job 1: Docker 이미지 빌드 및 ECR 푸시
  # ============================================
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.build-image.outputs.image_tag }}
      environment: ${{ steps.set-env.outputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Environment
        id: set-env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "environment=development" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        run: "echo ❤️"
        # uses: aws-actions/configure-aws-credentials@v4
        # with:
        #   aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        #   aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        #   aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        run: "echo ❤️"
        # uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          # ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Docker 빌드 및 푸시 (예제)
          # echo "Building Docker image..."
          # echo "docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ."
          # echo "docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          # echo "✅ Image pushed: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  # ============================================
  # Job 2: 배포 승인 대기
  # ============================================
  approve-deployment:
    name: Approve Deployment
    runs-on: ubuntu-latest
    needs: build
    environment: ${{ needs.build.outputs.environment }}-approval

    steps:
      - name: Deployment Approval
        run: |
          echo "🚀 배포 승인됨"
          echo "Environment: ${{ needs.build.outputs.environment }}"
          echo "Image Tag: ${{ needs.build.outputs.image_tag }}"

  # ============================================
  # Job 3: ECS 병렬 배포 (5개 서비스)
  # ============================================
  deploy-services:
    name: Deploy ${{ matrix.service.name }}
    needs: [build, approve-deployment]
    runs-on: ubuntu-latest
    environment: ${{ needs.build.outputs.environment }}-${{ matrix.service.name }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api-gateway
            task_definition_suffix: api-gateway
            cluster_suffix: main
          - name: user-service
            task_definition_suffix: user-svc
            cluster_suffix: main
          - name: order-service
            task_definition_suffix: order-svc
            cluster_suffix: main
          - name: payment-service
            task_definition_suffix: payment-svc
            cluster_suffix: payment
          - name: notification-service
            task_definition_suffix: notification-svc
            cluster_suffix: async

    steps:
      - name: Set environment-specific variables
        id: env-config
        run: |
          ENV="${{ needs.build.outputs.environment }}"

          # 환경별 공통 변수 설정
          if [[ "$ENV" == "production" ]]; then
            echo "account_id=111111111111" >> $GITHUB_OUTPUT
            echo "vpc_subnet=subnet-prod-xxxxx" >> $GITHUB_OUTPUT
            echo "security_group=sg-prod-xxxxx" >> $GITHUB_OUTPUT
            echo "log_level=warn" >> $GITHUB_OUTPUT
            echo "desired_count=3" >> $GITHUB_OUTPUT
          else
            echo "account_id=222222222222" >> $GITHUB_OUTPUT
            echo "vpc_subnet=subnet-dev-xxxxx" >> $GITHUB_OUTPUT
            echo "security_group=sg-dev-xxxxx" >> $GITHUB_OUTPUT
            echo "log_level=debug" >> $GITHUB_OUTPUT
            echo "desired_count=1" >> $GITHUB_OUTPUT
          fi

          # 서비스별 변수 조합
          echo "cluster_name=$ENV-cluster-${{ matrix.service.cluster_suffix }}" >> $GITHUB_OUTPUT
          echo "task_definition=$ENV-task-${{ matrix.service.task_definition_suffix }}" >> $GITHUB_OUTPUT
          echo "service_name=$ENV-svc-${{ matrix.service.name }}" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        run: "echo ❤️"
        # uses: aws-actions/configure-aws-credentials@v4
        # with:
        #   aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        #   aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        #   aws-region: ${{ env.AWS_REGION }}

      - name: Download task definition
        id: download-task-def
        run: "echo ❤️"
        # run: |
        #   # Task Definition 다운로드 (예제)
        #   echo "Downloading task definition: ${{ steps.env-config.outputs.task_definition }}"
        #   echo "aws ecs describe-task-definition --task-definition ${{ steps.env-config.outputs.task_definition }} --query taskDefinition > task-definition.json"

        #   # 예제용 더미 task definition 생성
        #   cat << 'EOF' > task-definition.json
        #   {
        #     "family": "${{ steps.env-config.outputs.task_definition }}",
        #     "containerDefinitions": [
        #       {
        #         "name": "${{ matrix.service.name }}",
        #         "image": "PLACEHOLDER",
        #         "cpu": 256,
        #         "memory": 512,
        #         "essential": true,
        #         "portMappings": [
        #           {
        #             "containerPort": 8080,
        #             "protocol": "tcp"
        #           }
        #         ],
        #         "environment": [
        #           {
        #             "name": "LOG_LEVEL",
        #             "value": "${{ steps.env-config.outputs.log_level }}"
        #           },
        #           {
        #             "name": "ENVIRONMENT",
        #             "value": "${{ needs.build.outputs.environment }}"
        #           }
        #         ]
        #       }
        #     ]
        #   }
        #   EOF

      - name: Update task definition with new image
        id: update-task-def
        run: "echo ❤️"
        # run: |
        #   ECR_REGISTRY="${{ steps.env-config.outputs.account_id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
        #   NEW_IMAGE="$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ needs.build.outputs.image_tag }}"

        #   echo "Updating task definition with image: $NEW_IMAGE"
        #   echo "new_image=$NEW_IMAGE" >> $GITHUB_OUTPUT

        #   # 예제: jq로 이미지 교체
        #   echo "jq '.containerDefinitions[0].image = \"'$NEW_IMAGE'\"' task-definition.json > updated-task-definition.json"

      - name: Register new task definition
        id: register-task-def
        run: "echo ❤️"
        # run: |
        #   echo "Registering new task definition..."
        #   echo "aws ecs register-task-definition --cli-input-json file://updated-task-definition.json"

        #   # 예제용 revision 출력
        #   echo "task_definition_arn=arn:aws:ecs:${{ env.AWS_REGION }}:${{ steps.env-config.outputs.account_id }}:task-definition/${{ steps.env-config.outputs.task_definition }}:42" >> $GITHUB_OUTPUT

      - name: Deploy to ECS
        id: deploy-ecs
        run: |
          echo "🚀 Deploying to ECS..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Environment: ${{ needs.build.outputs.environment }}"
          echo "Service: ${{ matrix.service.name }}"
          echo "Image Tag: ${{ needs.build.outputs.image_tag }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

        #   # ECS 서비스 업데이트 (예제)
        #   echo "aws ecs update-service \\"
        #   echo "  --cluster ${{ steps.env-config.outputs.cluster_name }} \\"
        #   echo "  --service ${{ steps.env-config.outputs.service_name }} \\"
        #   echo "  --task-definition ${{ steps.register-task-def.outputs.task_definition_arn }} \\"
        #   echo "  --desired-count ${{ steps.env-config.outputs.desired_count }} \\"
        #   echo "  --force-new-deployment"

      - name: Wait for deployment
        run: "echo ❤️"
        # run: |
        #   echo "⏳ Waiting for service stability..."
        #   echo "aws ecs wait services-stable --cluster ${{ steps.env-config.outputs.cluster_name }} --services ${{ steps.env-config.outputs.service_name }}"
        #   echo "✅ ${{ matrix.service.name }} deployed successfully!"

  # ============================================
  # Job 4: 배포 결과 취합 및 슬랙 알림
  # ============================================
  notify:
    name: Notify Deployment Result
    runs-on: ubuntu-latest
    needs: [build, deploy-services]
    if: always()

    steps:
      - name: Check deployment results
        id: check-results
        run: |
          # 배포 결과 확인
          DEPLOY_RESULT="${{ needs.deploy-services.result }}"

          if [[ "$DEPLOY_RESULT" == "success" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "color=#36a64f" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "color=#dc3545" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
          fi

          # 서비스별 배포 결과 수집 (실제 실행된 서비스만)
          SERVICE_LIST=""

          # deploy-services job이 실행되었는지 확인
          if [[ "$DEPLOY_RESULT" != "skipped" ]]; then
            # 전체 결과에 따라 모든 서비스에 동일한 상태 적용
            for service in api-gateway user-service order-service payment-service notification-service; do
              if [[ "$DEPLOY_RESULT" == "success" ]]; then
                SERVICE_LIST="${SERVICE_LIST}- ${service}: ✅\n"
              elif [[ "$DEPLOY_RESULT" == "failure" ]]; then
                SERVICE_LIST="${SERVICE_LIST}- ${service}: ❌\n"
              else
                SERVICE_LIST="${SERVICE_LIST}- ${service}: ⚠️\n"
              fi
            done
          fi

          echo "service_list<<EOF" >> $GITHUB_OUTPUT
          echo -e "$SERVICE_LIST" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send Slack notification
        run: |
          echo ❤️
          echo "[${{steps.check-results.outputs.color}}] ${{ steps.check-results.outputs.emoji }} ECS 배포 결과"
          echo "*Environment:*\n${{ needs.build.outputs.environment }}"
          echo "*Status:*\n${{ steps.check-results.outputs.status }}"
          echo "*Image Tag:*\n${{ needs.build.outputs.image_tag }}"
          echo "*Triggered by:*\n${{ github.actor }}"
          echo ""
          echo "*배포 서비스:*"
          echo "${{ steps.check-results.outputs.service_list }}"
          echo ""
          echo "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow Run>"
