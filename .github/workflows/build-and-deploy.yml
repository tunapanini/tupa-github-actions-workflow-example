        #         {
        #           "color": "${{ steps.check-results.outputs.color }}",
        #           "blocks": [
        #             {
        #               "type": "header",
        #               "text": {
        #                 "type": "plain_text",
        #                 "text": "${{ steps.check-results.outputs.emoji }} ECS 배포 결과"
        #               }
        #             },
        #             {
        #               "type": "section",
        #               "fields": [
        #                 {
        #                   "type": "mrkdwn",
        #                   "text": "*Environment:*\n${{ needs.build.outputs.environment }}"
        #                 },
        #                 {
